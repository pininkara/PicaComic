name: Android APK Release
run-name: Android release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['**']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to build and publish (e.g. v4.2.12)'
        type: string
        required: true
      prerelease:
        description: 'Publish as a prerelease (also automatic for vX.Y.Z-suffix tags)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      commit: ${{ steps.metadata.outputs.commit }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    env:
      ORG_GRADLE_PROJECT_cfFixBuild: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve existing tag and version
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          cp .github/scripts/android_release.py "$RUNNER_TEMP/android_release.py"
          python3 "$RUNNER_TEMP/android_release.py" metadata
      - name: Check out the exact tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.metadata.outputs.commit }}
          persist-credentials: false
      - name: Prepare fixed release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 "$RUNNER_TEMP/android_release.py" signing
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Build signed APKs
        env:
          BUILD_NAME: ${{ steps.metadata.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
        run: flutter build apk --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
      - name: Verify signatures and prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          test -n "$apksigner"
          for apk in build/app/outputs/apk/release/*.apk; do
            "$apksigner" verify "$apk"
            cp "$apk" release-assets/
          done
          cd release-assets
          sha256sum -- *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apks
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/release-signing.jks

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release-apks
          path: release-assets
      - name: Check downloaded assets
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Upload assets to a draft, then publish
        shell: bash
        run: |
          # Refuse a moved tag: the release must describe the commit we built.
          tag_commit=$(gh api "repos/$GH_REPO/commits/$(printf '%s' "$RELEASE_TAG" | jq -sRr @uri)" --jq .sha)
          test "$tag_commit" = "$RELEASE_COMMIT"
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            if [ "$(jq -r .isDraft release.json)" != true ]; then
              echo "Release already published; keeping its existing assets."
              exit 0
            fi
          else
            printf 'Android APKs built from %s (commit %s).\n\nIncludes universal, arm64-v8a and x86_64 APKs plus SHA256SUMS.txt.\n\nPackage: com.github.pacalini.pica_comic.cf_fix. See README for installation and signing details.\n' \
              "$RELEASE_TAG" "$RELEASE_COMMIT" > release-notes.md
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "PicaComic $RELEASE_TAG" --notes-file release-notes.md
          fi
          # Replacement is restricted to unpublished drafts, allowing failed uploads to retry.
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
